<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DensePress</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div id="toolbar">
    <label><input type="checkbox" id="opt-columns"> Two columns</label>
    <label><input type="checkbox" id="opt-images"> Images</label>
    <span id="pages"></span>
    <button id="print">Print</button>
  </div>
  <main id="page">
    <header id="masthead">
      <h1 id="title"></h1>
      <div id="meta"></div>
    </header>
    <article id="body"></article>
  </main>
  <script src="reader.js"></script>
</body>
</html>
